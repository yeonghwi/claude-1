<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 - 공지사항 관리</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
</head>
<body>
  <nav class="nav">
    <div class="links">
      <a href="index.html">홈페이지로</a>
    </div>
    <div id="auth-menu"></div>
  </nav>

  <main class="container">
    <p class="eyebrow">ADMIN</p>
    <h1 class="title">공지사항 관리</h1>

    <!-- 1) 로그인 안 했을 때 -->
    <div class="card hidden" id="login-card" style="max-width: 480px;">
      <form id="login-form">
        <input type="email" id="email" placeholder="관리자 이메일" required>
        <input type="password" id="password" placeholder="비밀번호" required>
        <button class="btn" type="submit">관리자 로그인</button>
      </form>
    </div>

    <!-- 2) 로그인했지만 관리자가 아닐 때 -->
    <div class="card hidden" id="denied-card">
      관리자 권한이 없는 계정입니다.
    </div>

    <!-- 3) 관리자일 때 -->
    <div class="hidden" id="admin-area">
      <div class="card" style="margin-bottom: 24px;">
        <h3 id="form-title" style="margin-top: 0;">새 공지 작성</h3>
        <form id="notice-form">
          <input type="text" id="title" placeholder="제목" required>
          <textarea id="content" placeholder="내용" required></textarea>
          <div class="btn-row" style="margin-top: 0;">
            <button class="btn gray hidden" type="button" id="cancel-btn">수정 취소</button>
            <button class="btn" type="submit" id="save-btn">등록</button>
          </div>
        </form>
      </div>

      <div class="card">
        <ul class="list" id="notice-list"></ul>
      </div>
    </div>
  </main>

  <script>
    let editingId = null; // 수정 중인 공지 id (null 이면 새 글 작성)
    const form = document.getElementById('notice-form');

    async function init() {
      const { data: { user } } = await db.auth.getUser();
      if (!user) { show('login-card'); return; }

      // admins 테이블에 내 id가 있는지 확인
      const { data } = await db.from('admins').select('user_id').eq('user_id', user.id);
      if (!data || data.length === 0) { show('denied-card'); return; }

      show('admin-area');
      loadNotices();
    }

    function show(id) {
      document.getElementById(id).classList.remove('hidden');
    }

    async function loadNotices() {
      const { data, error } = await db
        .from('notices')
        .select('*')
        .order('created_at', { ascending: false });

      const list = document.getElementById('notice-list');
      if (error) { list.innerHTML = `<li class="empty">오류: ${escapeHtml(error.message)}</li>`; return; }
      if (data.length === 0) { list.innerHTML = '<li class="empty">등록된 공지사항이 없습니다.</li>'; return; }

      list.innerHTML = data.map(n => `
        <li style="display: flex; align-items: center; gap: 16px; padding: 14px 0;">
          <span class="badge">공지</span>
          <span class="subject">${escapeHtml(n.title)}</span>
          <span class="date">${formatDate(n.created_at)}</span>
          <button class="btn gray" onclick="startEdit(${n.id})">수정</button>
          <button class="btn red" onclick="removeNotice(${n.id})">삭제</button>
        </li>
      `).join('');
    }

    // 관리자 로그인
    document.getElementById('login-form').onsubmit = async (e) => {
      e.preventDefault();
      const { error } = await db.auth.signInWithPassword({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      });
      if (error) { alert('로그인 실패: ' + error.message); return; }
      location.reload();
    };

    // 등록 / 수정 저장
    form.onsubmit = async (e) => {
      e.preventDefault();
      const notice = {
        title: document.getElementById('title').value,
        content: document.getElementById('content').value,
      };

      const { error } = editingId
        ? await db.from('notices').update(notice).eq('id', editingId)
        : await db.from('notices').insert(notice);

      if (error) { alert('저장 실패: ' + error.message); return; }
      resetForm();
      loadNotices();
    };

    async function startEdit(id) {
      const { data } = await db.from('notices').select('*').eq('id', id).single();
      editingId = id;
      document.getElementById('title').value = data.title;
      document.getElementById('content').value = data.content;
      document.getElementById('form-title').textContent = '공지 수정';
      document.getElementById('save-btn').textContent = '수정 저장';
      show('cancel-btn');
      window.scrollTo(0, 0);
    }

    function resetForm() {
      editingId = null;
      form.reset();
      document.getElementById('form-title').textContent = '새 공지 작성';
      document.getElementById('save-btn').textContent = '등록';
      document.getElementById('cancel-btn').classList.add('hidden');
    }
    document.getElementById('cancel-btn').onclick = resetForm;

    async function removeNotice(id) {
      if (!confirm('이 공지를 삭제하시겠습니까?')) return;
      const { error } = await db.from('notices').delete().eq('id', id);
      if (error) { alert('삭제 실패: ' + error.message); return; }
      loadNotices();
    }

    init();
  </script>
</body>
</html>
